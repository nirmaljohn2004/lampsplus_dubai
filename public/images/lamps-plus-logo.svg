<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100">
  <g transform="rotate(45 50 50)">
    <!-- Top-Left (becomes Top) - Blue -->
    <rect x="18" y="18" width="30" height="30" rx="5" fill="#1b75bc" />
    <!-- Top-Right (becomes Right) - Green -->
    <rect x="52" y="18" width="30" height="30" rx="5" fill="#8bc53f" />
    <!-- Bottom-Left (becomes Left) - Red -->
    <rect x="18" y="52" width="30" height="30" rx="5" fill="#f05a49" />
    <!-- Bottom-Right (becomes Bottom) - Yellow -->
    <rect x="52" y="52" width="30" height="30" rx="5" fill="#f7a91a" />
  </g>
  <text x="115" y="66" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Lamps plus</text>
</svg>
